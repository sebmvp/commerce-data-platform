services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cdp
      POSTGRES_PASSWORD: cdp
      POSTGRES_DB: cdp
    ports:
      - "5432:5432"
    volumes:
      - cdp_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdp -d cdp"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      CDP_DATABASE_URL: postgresql://cdp:cdp@postgres:5432/cdp
      CDP_DATA: /app/sample_data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cdp_pgdata:
