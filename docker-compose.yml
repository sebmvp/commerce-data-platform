services:
  # One-shot: builds the warehouse from sample data, then exits.
  build:
    build: .
    command: ["build", "--sample"]
    environment:
      CDP_DB: /app/data/warehouse.duckdb
    volumes:
      # Mount the host dir (not the file) — duckdb needs to create/replace the
      # file atomically, and a mounted file that doesn't exist becomes a dir.
      - ./data:/app/data

  # Long-running: FastAPI read layer over ./warehouse.duckdb.
  api:
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      CDP_DB: /app/data/warehouse.duckdb
    volumes:
      - ./data:/app/data
    depends_on:
      - build
