name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ".[api]"

      - name: pytest
        run: pytest -q

      - name: Full-pipeline smoke build
        run: |
          cdp build --sample
          cdp status
        env:
          CDP_DB: /tmp/cdp-smoke.duckdb

      - name: Lint (informational)
        run: ruff check src/ tests/ || true

      - name: Docker image smoke build
        run: |
          docker build -t cdp-ci .
          # Both containers must share the warehouse file; --rm alone discards
          # the build output, which is exactly what broke main at aa42ee7.
          docker volume create cdp-ci-data
          docker run --rm -e CDP_DB=/data/warehouse.duckdb -v cdp-ci-data:/data cdp-ci build --sample
          docker run --rm -e CDP_DB=/data/warehouse.duckdb -v cdp-ci-data:/data cdp-ci status
          docker volume rm cdp-ci-data
