name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ".[api]"

      - name: pytest
        run: pytest -q

      - name: Full-pipeline smoke build
        run: |
          cdp build --sample
          cdp status
        env:
          CDP_DB: /tmp/cdp-smoke.duckdb

      - name: Lint (informational)
        run: ruff check src/ tests/ || true

      - name: Docker image smoke build
        run: |
          docker build -t cdp-ci .
          docker run --rm -e CDP_DB=/tmp/cdp-docker.duckdb cdp-ci build --sample
          docker run --rm -e CDP_DB=/tmp/cdp-docker.duckdb cdp-ci status
