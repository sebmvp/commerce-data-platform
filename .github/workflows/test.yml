name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cdp
          POSTGRES_PASSWORD: cdp
          POSTGRES_DB: cdp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdp -d cdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CDP_DATABASE_URL: postgresql://cdp:cdp@localhost:5432/cdp
      CDP_TEST_DATABASE_URL: postgresql://cdp:cdp@localhost:5432/cdp_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,mcp]"

      - name: pytest
        run: pytest -q

      - name: Full-pipeline smoke build
        run: |
          cdp build --sample --force
          cdp status
          cdp eval

      - name: Frontend typecheck
        run: |
          cd web
          npm install
          npx tsc --noEmit

      - name: Lint (informational)
        run: ruff check src/ tests/ || true
