name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cdp
          POSTGRES_PASSWORD: cdp
          POSTGRES_DB: cdp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdp -d cdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable local/CI password is the literal "cdp". GitHub Actions
      # redacts that value as "***" in logs — never paste the masked form
      # into executable configuration. Local tests passing != remote CI green.
      CDP_DATABASE_URL: postgresql://cdp:cdp@localhost:5432/cdp
      CDP_TEST_DATABASE_URL: postgresql://cdp:cdp@localhost:5432/cdp_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,mcp]"

      - name: Ruff
        run: ruff check src/ tests/ evals/ scripts/ synthetic/

      - name: pytest
        run: pytest -q

      - name: Demo world eval
        run: |
          cdp build --sample --force
          cdp status
          cdp eval
          cdp eval --compare
          cdp eval --answers
          cdp eval --plan
          cdp eval --analyst

      - name: Held-out eval
        env:
          CDP_DATABASE_URL: postgresql://cdp:cdp@localhost:5432/cdp_heldout
          CDP_DATA: sample_data_heldout
        run: |
          python -c "from cdp_cli.db import ensure_database; ensure_database()"
          cdp build --sample --force
          cdp eval --heldout

      - name: Frontend typecheck
        run: |
          cd web
          npm install
          npx tsc --noEmit

      - name: Browser smoke
        run: |
          cdp serve --host 127.0.0.1 --port 8000 &
          cd web
          npx playwright install --with-deps chromium
          npm run build
          npx vite preview --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && curl -sf http://127.0.0.1:5173 >/dev/null && break
            sleep 1
          done
          npx playwright test
