[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-data-platform"
version = "0.6.0"
description = "Business context engine for resale operations: objects, relationships, history, metrics, and typed tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
cdp = "cdp_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "EXE001",
  "DTZ001",
  "DTZ005",
  "BLE001",
  "S110",
  "PLW1510",
]
