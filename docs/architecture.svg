<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-label="Commerce Data Platform architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6288"/>
    </marker>
  </defs>
  <style>
    .box  { fill: #151126; stroke: #8b5cf6; stroke-width: 1.4; }
    .boxd { fill: #151126; stroke: #6b6288; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .t    { fill: #f4f1ff; font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .ts   { fill: #9a92b2; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .line { stroke: #6b6288; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
  </style>

  <rect class="box" x="230" y="16" width="260" height="46" rx="8"/>
  <text class="t" x="360" y="36">Sources</text>
  <text class="ts" x="360" y="52">8 JSONL streams · synthetic</text>

  <line class="line" x1="360" y1="62" x2="360" y2="86"/>

  <rect class="box" x="230" y="86" width="260" height="46" rx="8"/>
  <text class="t" x="360" y="106">Ingestion + validation</text>
  <text class="ts" x="360" y="122">hash skip · quarantine · atomic runs</text>

  <line class="line" x1="360" y1="132" x2="360" y2="156"/>

  <rect class="box" x="230" y="156" width="260" height="46" rx="8"/>
  <text class="t" x="360" y="176">DuckDB warehouse</text>
  <text class="ts" x="360" y="192">core · catalog · sales · insights</text>

  <line class="line" x1="360" y1="202" x2="360" y2="226"/>

  <rect class="box" x="230" y="226" width="260" height="46" rx="8"/>
  <text class="t" x="360" y="246">Trust / reconciliation</text>
  <text class="ts" x="360" y="262">read = loaded + rejected</text>

  <line class="line" x1="360" y1="272" x2="360" y2="296"/>

  <rect class="box" x="230" y="296" width="260" height="46" rx="8"/>
  <text class="t" x="360" y="316">Metric definitions</text>
  <text class="ts" x="360" y="332">grain · nulls · limitations</text>

  <line class="line" x1="360" y1="342" x2="360" y2="366"/>

  <rect class="box" x="230" y="366" width="260" height="46" rx="8"/>
  <text class="t" x="360" y="386">Business tools / API</text>
  <text class="ts" x="360" y="402">snapshot · attention · CLI · FastAPI</text>

  <line class="line" x1="360" y1="412" x2="360" y2="444"/>

  <rect class="boxd" x="230" y="444" width="260" height="46" rx="8"/>
  <text class="t" x="360" y="464">AI copilot</text>
  <text class="ts" x="360" y="480">future · tools + provenance</text>
</svg>
