<svg xmlns="http://www.w3.org/2000/svg" width="720" height="148" viewBox="0 0 720 148" role="img" aria-label="Commerce Data Platform architecture">
  <rect width="720" height="148" rx="8" fill="#0c0b12"/>
  <rect width="720" height="148" rx="8" fill="none" stroke="#2c2838" stroke-width="1"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="60" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f0f7">Sources</text>
    <text x="60" y="60" text-anchor="middle" font-size="11" fill="#8a8498">8 JSONL streams</text>

    <text x="180" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f0f7">Ingest</text>
    <text x="180" y="60" text-anchor="middle" font-size="11" fill="#8a8498">validate · quarantine</text>

    <text x="300" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f0f7">Warehouse</text>
    <text x="300" y="60" text-anchor="middle" font-size="11" fill="#8a8498">DuckDB cache</text>

    <text x="420" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f0f7">Trust</text>
    <text x="420" y="60" text-anchor="middle" font-size="11" fill="#8a8498">read = load + rej</text>

    <text x="540" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f0f7">Metrics</text>
    <text x="540" y="60" text-anchor="middle" font-size="11" fill="#8a8498">named definitions</text>

    <text x="660" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f0f7">Tools</text>
    <text x="660" y="60" text-anchor="middle" font-size="11" fill="#8a8498">CLI · FastAPI</text>

    <line x1="60" y1="88" x2="660" y2="88" stroke="#2c2838" stroke-width="1"/>
    <circle cx="60" cy="88" r="3.5" fill="#8b5cf6"/>
    <circle cx="180" cy="88" r="3.5" fill="#8b5cf6"/>
    <circle cx="300" cy="88" r="3.5" fill="#8b5cf6"/>
    <circle cx="420" cy="88" r="3.5" fill="#8b5cf6"/>
    <circle cx="540" cy="88" r="3.5" fill="#8b5cf6"/>
    <circle cx="660" cy="88" r="3.5" fill="#8b5cf6"/>

    <text x="36" y="124" font-size="12" fill="#6b6578">AI copilot is future work. It would call these tools.</text>
  </g>
</svg>
